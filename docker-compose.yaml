
services:
  mysql:
    image: mysql:8.0
    container_name: mini-orders-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_local_pw

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
